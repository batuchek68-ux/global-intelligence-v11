name: Global Intelligence Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install feedparser

      - name: Fetch News
        run: python src/fetch_news.py

      - name: Preprocess
        run: python src/preprocess.py

      - name: Trend Analysis
        run: python src/analyze_trend.py

      - name: Generate Dashboard
        run: python src/generate_report.py

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "bot@users.noreply.github.com"

          git add data output || true

          git commit -m "auto update" || exit 0

          git push
