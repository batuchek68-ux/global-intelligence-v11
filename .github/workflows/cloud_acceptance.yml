name: GitHub Cloud Acceptance

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  cloud-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-python@v5
        id: python_setup
        with:
          python-version: "3.12"

      - name: Preflight check
        id: preflight
        continue-on-error: true
        run: python workflows/preflight_check.py
        working-directory: backend

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests
        working-directory: backend

      - name: Run daily operating cycle
        id: daily_job
        continue-on-error: true
        run: python workflows/daily_job.py
        working-directory: backend

      - name: Run watchdog
        id: watchdog
        continue-on-error: true
        run: python workflows/watchdog.py
        working-directory: backend

      - name: Run cloud acceptance
        id: cloud_acceptance
        continue-on-error: true
        run: python workflows/cloud_acceptance.py
        working-directory: backend

      - name: Review cloud acceptance audit gate
        if: always() && steps.checkout.outcome == 'success' && steps.python_setup.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_files = [
              Path('backend/reports/cloud_acceptance.json'),
              Path('backend/reports/autonomous_repair.json'),
              Path('backend/reports/watchdog_status.md'),
          ]

          for path in report_files:
              if path.exists():
                  print(f"Audit artifact present: {path}")
              else:
                  print(f"::warning::{path} missing; human review required.")
                  print(f"{path} missing; human review required.")

          cloud_report = Path('backend/reports/cloud_acceptance.json')
          if cloud_report.exists():
              data = json.loads(cloud_report.read_text(encoding='utf-8'))
              status = data.get('status', 'unknown')
              print(f"Cloud acceptance status: {status}")
              if status in {'PASS', 'pass', 'PASS_WITH_WARNINGS'}:
                  print('::notice::Cloud acceptance is recorded as pass or advisory status; no hard red screen is raised.')
              else:
                  print('::warning::Cloud acceptance is advisory only; human review is required before release or publication.')
          else:
              print('::warning::Cloud acceptance report missing; audit gate is advisory only.')
          print('Cloud acceptance audit gate complete.')
          PY
        working-directory: backend

      - name: Persist acceptance evidence
        if: always() && steps.checkout.outcome == 'success' && steps.python_setup.outcome == 'success'
        env:
          STATE_COMMIT_MESSAGE: Persist GitHub cloud acceptance evidence
        run: python workflows/persist_state.py
        working-directory: backend

      - name: Upload acceptance artifacts
        if: always() && steps.checkout.outcome == 'success' && steps.python_setup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: github-cloud-acceptance-${{ github.run_id }}
          path: |
            reports/cloud_acceptance.md
            reports/cloud_acceptance.json
            reports/headquarters_status.md
            reports/owner_inbox.md
            reports/watchdog_status.md
            memory/
          if-no-files-found: warn
