name: International Trade AI Ops

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Research topic or project focus"
        required: false
        default: "international engineering trade policy logistics compliance risk"
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  daily-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      ENTERPRISE_WECHAT_WEBHOOK_URL: ${{ secrets.ENTERPRISE_WECHAT_WEBHOOK_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      OPS_TOPIC: ${{ github.event.inputs.topic }}
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-python@v5
        id: python_setup
        with:
          python-version: "3.12"

      - name: Preflight check
        id: preflight
        continue-on-error: true
        run: python workflows/preflight_check.py
        working-directory: backend

      - name: Ensure GitHub labels
        id: ensure_labels
        continue-on-error: true
        run: python workflows/ensure_labels.py
        working-directory: backend

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests
        working-directory: backend

      - name: Run daily operating cycle
        id: daily_job
        continue-on-error: true
        run: python workflows/daily_job.py
        working-directory: backend

      - name: Publish headquarters summary
        id: publish_summary
        continue-on-error: true
        run: python workflows/publish_summary.py
        working-directory: backend

      - name: Review ops audit gate
        if: always() && steps.checkout.outcome == 'success' && steps.python_setup.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          report_paths = [
              Path('backend/reports/headquarters_status.md'),
              Path('backend/reports/daily_job.json'),
              Path('reports/headquarters_status.md'),
          ]
          for p in report_paths:
              if p.exists():
                  print(f"Audit artifact present: {p}")
              else:
                  print(f"::warning::{p} missing; human review required.")
          print('::notice::International Trade ops are audit-first and non-red-screen by design.')
          PY
        working-directory: backend

      - name: Persist operating state
        if: always() && steps.checkout.outcome == 'success' && steps.python_setup.outcome == 'success'
        run: python workflows/persist_state.py
        working-directory: backend

      - name: Upload operating artifacts
        if: always() && steps.checkout.outcome == 'success' && steps.python_setup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: international-trade-ai-${{ github.run_id }}
          path: |
            memory/
            research/briefs/
            media/drafts/
            comm/outbox/
            reports/
          if-no-files-found: warn
