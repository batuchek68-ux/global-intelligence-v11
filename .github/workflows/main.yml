name: V11 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint with py_compile
      run: |
        python -m py_compile api/main.py
        python -m py_compile core/agents.py
        python -m py_compile core/orchestration.py
        python -m py_compile integrations/ima_connector.py
        python -m py_compile integrations/obsidian_connector.py
        
    - name: Verify API routes
      run: |
        python -c "from api.main import app; paths = app.openapi()['paths']; expected = ['/v1/search', '/v1/query', '/v1/system/capabilities', '/v1/system/integrity', '/v1/system/self-improvement/run']; missing = [path for path in expected if path not in paths]; assert not missing, f'Missing API routes: {missing}'; print(f'API loaded; verified {len(expected)} routes')"

    - name: Run backend tests
      run: python -m unittest discover -s tests -v
      working-directory: backend
